spring.config.import=optional:file:./.env[.properties]
spring.application.name=backend
server.port=8081
# Obligar a Spring a lanzar una excepción si el frontend le pega a una ruta que no existe
spring.mvc.throw-exception-if-no-handler-found=true
# Desactivar el mapeo estático por defecto para que la excepción funcione correctamente
spring.web.resources.add-mappings=false

# ==========================================
# CONFIGURACION DE POSTGRESQL (DATA SOURCE)
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/club_ajedrez
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# CONFIGURACION DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Configuración SMTP de Gmail
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tallergamedev40@gmail.com
spring.mail.password=lkzw mujc funl yxuq
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Esto soluciona de forma limpia el conflicto de la zona horaria con el driver y la base de datos
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


cors.allowed.origins=http://localhost:5173, http://192.168.1.39:5173

# ==========================================
# Configuración IA y estringir el tamaño de los archivos
# ==========================================
spring.servlet.multipart.max-file-size=100KB
spring.servlet.multipart.max-request-size=100KB
google.gemini.api.key=${GEMINI_API_KEY}
openrouter.api.key=${OPENROUTER_API_KEY}
nvidia.api.key=${NVIDIA_API_KEY}
app.db.seed=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB